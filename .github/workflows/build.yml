name: Build

on:
  push:
  pull_request:

# Submitting the dependency graph needs write access to the repository contents.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: corretto
          java-version: 25
      # Reports every resolved dependency, transitive ones included, to GitHub. Dependabot alerts use it to warn about
      # known vulnerabilities. Only pushes to master submit, that is the branch the alerts look at.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          dependency-graph: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'generate-and-submit' || 'disabled' }}
      # The SSH integration tests start their own sshd as the runner user, the package only provides the binaries.
      - name: Install OpenSSH server binaries
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - run: ./gradlew build shadowJar
      - name: Check merged SLF4J service file
        run: test "$(unzip -p build/libs/dirl.jar META-INF/services/org.slf4j.spi.SLF4JServiceProvider)" = "bayern.kickner.klogger.slf4j.KloggerServiceProvider"
      - name: Upload fat JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dirl-jar
          path: build/libs/dirl.jar
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: build/reports/tests/
